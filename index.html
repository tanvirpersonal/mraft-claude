<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf2;--pn:#f6f8fa;--ln:#c3cfda;--tx:#13212e;--mu:#586e81;--ac:#0b7a9e;--wn:#a85f00;--ok:#1b7f4b;--gr:#9fb2c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1520;--pn:#121f2c;--ln:#233648;--tx:#d6e2ed;--mu:#8ba2b6;--ac:#52c7ea;--wn:#f0b34a;--ok:#5fd38d;--gr:#2a4056}}
:root[data-theme="dark"]{--bg:#0c1520;--pn:#121f2c;--ln:#233648;--tx:#d6e2ed;--mu:#8ba2b6;--ac:#52c7ea;--wn:#f0b34a;--ok:#5fd38d;--gr:#2a4056}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.35 "Barlow Semi Condensed",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:224px 1fr;height:100%}
#pal{background:var(--pn);border-right:1px solid var(--ln);overflow:auto;padding:4px 10px 10px}
#pal h3{margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--mu)}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{touch-action:pan-y;background:var(--bg);border:1px solid var(--ln);border-radius:6px;color:var(--tx);font:inherit;font-size:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;user-select:none;-webkit-user-select:none}
.tile:hover{border-color:var(--ac)}
.tile canvas{width:56px;height:56px;pointer-events:none}
#stage{position:relative;overflow:hidden;min-width:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0 0 auto 0;display:flex;flex-wrap:wrap;gap:8px;padding:10px;pointer-events:none;align-items:flex-start}
#hud>*{pointer-events:auto}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.b{font:inherit;font-weight:600;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:6px 11px;cursor:pointer}
.b:hover{border-color:var(--ac)}
.b[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#msg{align-self:center;color:var(--mu)}
.card{margin-left:auto;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-width:196px}
dl{display:grid;grid-template-columns:auto auto;gap:2px 16px;margin:0}
dt{color:var(--mu)}dd{margin:0;text-align:right;font-weight:600}
#st{margin-top:8px;font-weight:600;color:var(--wn)}
#st.ok{color:var(--ok)}
@media(max-width:720px){
#app{grid-template-columns:1fr;grid-template-rows:1fr 112px}
#pal{order:2;border-right:0;border-top:1px solid var(--ln);display:flex;gap:6px;padding:8px;overflow-x:auto;overflow-y:hidden}
#pal h3{display:none}.grp{display:flex;gap:6px}
.tile{touch-action:pan-x;flex:none;width:78px}
.card{margin-left:0;width:100%;min-width:0;padding:8px 10px}
dl{grid-template-columns:repeat(6,auto);gap:2px 8px}dd{text-align:left}
}
</style>
</head>
<body>
<div id="app">
<aside id="pal" aria-label="Parts"></aside>
<main id="stage">
<canvas id="c" aria-label="Rocket assembly grid"></canvas>
<div id="hud">
<div class="bar">
<button class="b" id="mi" aria-pressed="true">Mirror</button>
<button class="b" id="de">Delete</button>
<button class="b" id="cl">Clear</button>
<button class="b" id="sv">Save</button>
<button class="b" id="launch">Launch</button>
<button class="b" id="ld">Load</button>
<button class="b" id="zi" aria-label="Zoom in">+</button>
<button class="b" id="zo" aria-label="Zoom out">&minus;</button>
<button class="b" id="sp" aria-pressed="false" disabled>Unfold panel</button>
<button class="b" id="ss" aria-pressed="false">Stage select</button>
<button class="b" id="cs" disabled>Create stage</button>
<button class="b" id="us" disabled>Unstage</button>
<span id="stage-info" aria-live="polite"></span>
<span id="msg" aria-live="polite"></span>
</div>
<div class="card"><dl id="sm"></dl><div id="st"></div></div>
</div>
</main>
</div>
<script src="rocket-renderer.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
// Part catalog: mass/fuel in tonnes, thrust in kN, isp in s, size in grid units
const U=[
['pod','Command pod','Pods',2,1.8,1.2,0,0,0,'pod'],
['nose','Nose cone','Pods',2,2,.2,0,0,0,'nose'],
['t1','Tank S','Tanks',2,2,.2,1.8,0,0,'tank'],
['t2','Tank M','Tanks',2,4,.4,3.6,0,0,'tank'],
['t3','Tank L','Tanks',3,4,.8,8.1,0,0,'tank'],
['t4','Tank XL','Tanks',3,6,1.2,12.6,0,0,'tank'],
['e1','Sea-level engine','Engines',2,2,.9,0,220,290,'eng'],
['e2','Vacuum engine','Engines',2,1.8,.7,0,90,380,'vac'],
['e3','Heavy engine','Engines',3,2.6,1.4,0,480,310,'eng'],
['b1','Solid booster','Engines',1.2,5,.5,6,300,240,'srb'],
['b2','Heavy booster','Engines',1.6,7,.8,10,420,250,'srb'],
['dc','Decoupler','Structure',2,.4,.1,0,0,0,'dec'],
['para','Parachute','Utility',2,1.6,.3,0,0,0,'para'],
['dock','Docking connector','Utility',1.2,.8,.2,0,0,0,'dock'],
['solar','Solar panel','Utility',2,3,.25,0,0,0,'solar'],
['fin','Fin','Structure',1.4,2,.1,0,0,0,'fin'],
['leg','Landing leg','Structure',1.6,2.6,.15,0,0,0,'leg']
].map(([id,n,g,w,h,m,f,t,i,k])=>({id,n,g,w,h,m,f,t,i,k}));
const COL=MRAFT_ROCKET_RENDERER.COL;
const draw=MRAFT_ROCKET_RENDERER.draw;
let W=0,H=0,D=1,parts=[],sel=null,drag=null,pan=null,mirror=true,stageMode=false,stagePick=new Set(),init=0,ft,cam={x:0,y:0,s:22};
const side=u=>u.k=='fin'||u.k=='leg';
const toW=(x,y)=>[(x-W/2)/cam.s+cam.x,(y-H/2)/cam.s+cam.y];
const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const mk=(u,x,y,stage=0)=>{const p={u,x,y,tw:null,deployed:false,stage};parts.push(p);return p};
const flash=t=>{$('#msg').textContent=t;clearTimeout(ft);ft=setTimeout(()=>$('#msg').textContent='',1800)};

// Procedural part art, drawn centred on (x,y); s = pixels per unit
// Attachment snapping: stack above/below, or side-by-side (centre/top/bottom aligned)
function snap(p){
 const u=p.u;let b=null,bd=40/cam.s;
 for(const q of parts){if(q===p||q===p.tw)continue;
  const v=q.u,dx=(u.w+v.w)/2,dy=(u.h+v.h)/2,t=(v.h-u.h)/2;
  const spots=[[q.x,q.y+dy],[q.x,q.y-dy],...[1,-1].flatMap(s=>[[q.x+s*dx,q.y],[q.x+s*dx,q.y-t],[q.x+s*dx,q.y+t]])];
  if(q.u.k=='solar'&&q.deployed){const dir=q.x<0?-1:1,far=q.x+dir*(q.u.w*2.25+v.w/2);spots.push(...[q.y,q.y-t,q.y+t].map(y=>[far,y]))}
  for(const c of spots){const d=Math.hypot(c[0]-p.x,c[1]-p.y);if(d<bd){bd=d;b=c}}}
 if(b){p.x=b[0];p.y=b[1]}else{p.x=Math.round(p.x*4)/4;p.y=Math.round(p.y*4)/4;if(Math.abs(p.x)<.6)p.x=0}
 sync(p)}
// Symmetry: off-centre parts get a mirrored twin about the centre line
function sync(p){const t=p.tw,off=Math.abs(p.x)>.05;
 if(t&&!off){parts.splice(parts.indexOf(t),1);stagePick.delete(t);if(sel===t)sel=p;p.tw=null}
 else if(!t&&off&&mirror){p.tw=mk(p.u,0,0,p.stage);p.tw.tw=p}
 if(p.tw){p.tw.x=-p.x;p.tw.y=p.y;p.tw.stage=p.stage}}
function del(p){[p,p.tw].forEach(q=>{const i=parts.indexOf(q);if(i>=0)parts.splice(i,1);stagePick.delete(q)});if(p.tw)p.tw.tw=null;if(sel===p||sel===p.tw)sel=null}
function toggleStagePick(p){const pair=[p,p.tw].filter(Boolean),remove=pair.every(q=>stagePick.has(q));for(const q of pair)remove?stagePick.delete(q):stagePick.add(q)}
function createStage(){if(!stagePick.size)return;const n=Math.max(0,...parts.map(p=>p.stage||0))+1;for(const p of stagePick){p.stage=n;if(p.tw)p.tw.stage=n}stagePick.clear();flash('Stage '+n+' created');render()}
function unstagePicked(){for(const p of stagePick){p.stage=0;if(p.tw)p.tw.stage=0}stagePick.clear();render()}
function auto(p){const o=parts.filter(q=>q!==p),top=p.u.k=='pod'||p.u.k=='nose';
 p.x=0;p.y=o.length?(top?Math.min(...o.map(q=>q.y-q.u.h/2))-p.u.h/2:Math.max(...o.map(q=>q.y+q.u.h/2))+p.u.h/2):0}

function stats(){let m=0,f=0,F=0,Fi=0,cx=0,cy=0;
 for(const q of parts){const u=q.u,w=u.m+u.f;m+=w;f+=u.f;F+=u.t;if(u.t)Fi+=u.t/u.i;cx+=w*q.x;cy+=w*q.y}
 const isp=Fi?F/Fi:0;
 return{m,f,F,twr:m?F/(m*9.81):0,dv:isp&&f>0?isp*9.81*Math.log(m/(m-f)):0,com:m?[cx/m,cy/m]:null}}

function render(){
 if(!W)return;
 const cs=getComputedStyle(document.documentElement),V=n=>cs.getPropertyValue(n).trim(),s=cam.s,cx=x=>(x-cam.x)*s+W/2,cy=y=>(y-cam.y)*s+H/2;
 ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,W,H);ctx.lineWidth=1;ctx.strokeStyle=V('--gr');
 for(let i=Math.floor(cam.x-W/2/s);i<=cam.x+W/2/s;i++){ctx.globalAlpha=i%5?.25:.7;const x=Math.round(cx(i))+.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let j=Math.floor(cam.y-H/2/s);j<=cam.y+H/2/s;j++){ctx.globalAlpha=j%5?.25:.7;const y=Math.round(cy(j))+.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.globalAlpha=1;ctx.strokeStyle=V('--ac');ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(cx(0),0);ctx.lineTo(cx(0),H);ctx.stroke();ctx.setLineDash([]);
 for(const p of parts)draw(ctx,p.u,cx(p.x),cy(p.y),s,(side(p.u)||p.u.k=='solar')&&p.x<0,p.deployed);
 drawJoinAdapters();
 for(const p of parts)if(p.stage){const x=cx(p.x),y=cy(p.y)-p.u.h*s/2-12;ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(8,20,30,.82)';ctx.fillRect(x-13,y-10,26,16);ctx.fillStyle=V('--ac');ctx.fillText('S'+p.stage,x,y+2)}
 for(const p of stagePick){const w=p.u.w*s,h=p.u.h*s;ctx.strokeStyle=V('--wn');ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(cx(p.x)-w/2-5,cy(p.y)-h/2-5,w+10,h+10);ctx.setLineDash([])}
 if(sel){const w=sel.u.w*s,h=sel.u.h*s;ctx.strokeStyle=V('--ac');ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(cx(sel.x)-w/2-4,cy(sel.y)-h/2-4,w+8,h+8);ctx.setLineDash([])}
 const S=stats();
 if(S.com){const x=cx(S.com[0]),y=cy(S.com[1]);ctx.strokeStyle=ctx.fillStyle=V('--wn');ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.moveTo(x-11,y);ctx.lineTo(x+11,y);ctx.moveTo(x,y-11);ctx.lineTo(x,y+11);ctx.stroke();ctx.font='12px "Barlow Semi Condensed",system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('CoM',x+12,y-9)}
 else{ctx.fillStyle=V('--mu');ctx.textAlign='center';ctx.font='15px "Barlow Semi Condensed",system-ui,sans-serif';ctx.fillText('Drag a part onto the grid, or tap one to stack it.',W/2,H/2)}
 const sp=$('#sp'),solarSelected=sel?.u.id=='solar';sp.disabled=!solarSelected;sp.textContent=solarSelected&&sel.deployed?'Fold panel':'Unfold panel';sp.setAttribute('aria-pressed',solarSelected&&sel.deployed);
 $('#ss').setAttribute('aria-pressed',stageMode);$('#ss').textContent=stageMode?'Stage select: ON':'Stage select';
 $('#cs').disabled=!stagePick.size;$('#us').disabled=!stagePick.size;
 $('#stage-info').textContent=stageMode?`Tap parts to select · ${stagePick.size} selected · ${new Set(parts.map(p=>p.stage).filter(Boolean)).size} stages`:`${stagePick.size} selected · ${new Set(parts.map(p=>p.stage).filter(Boolean)).size} stages`;
 $('#sm').innerHTML=[['Mass',S.m.toFixed(1)+' t'],['Fuel',S.f.toFixed(1)+' t'],['Thrust',Math.round(S.F)+' kN'],['TWR',S.twr.toFixed(2)],['Δv',Math.round(S.dv).toLocaleString()+' m/s'],['Parts',parts.length]].map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
 const bad=!parts.some(q=>q.u.k=='pod')?'Add a command pod':!S.F?'Add an engine':!S.f?'Add a fuel tank':S.twr<1?'TWR is under 1: add thrust or remove mass':'';
 const st=$('#st');st.textContent=bad||'Ready to launch';st.className=bad?'':'ok'}

function drawJoinAdapters(){
 for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){
  const a=parts[i],b=parts[j];
  if(Math.abs(a.x-b.x)>.08)continue;
  const upper=a.y<b.y?a:b,lower=a.y<b.y?b:a;
  const gap=(lower.y-lower.u.h/2)-(upper.y+upper.u.h/2);
  if(Math.abs(gap)>.12)continue;
  const s=cam.s,x=(upper.x-cam.x)*s+W/2,y=(upper.y+upper.u.h/2+gap/2-cam.y)*s+H/2;
  const top=upper.u.w*s,bottom=lower.u.w*s,different=Math.abs(top-bottom)>s*.05;
  const h=(different?.30:.14)*s;
  ctx.save();
  const g=ctx.createLinearGradient(x-Math.max(top,bottom)/2,0,x+Math.max(top,bottom)/2,0);
  g.addColorStop(0,'#46525e');g.addColorStop(.2,'#aebbc6');g.addColorStop(.5,'#e2e8ed');g.addColorStop(.8,'#aebbc6');g.addColorStop(1,'#46525e');
  ctx.fillStyle=g;ctx.strokeStyle='rgba(8,14,22,.9)';ctx.lineWidth=Math.max(1,s*.045);
  ctx.beginPath();
  if(different){
   ctx.moveTo(x-top/2,y-h/2);ctx.lineTo(x+top/2,y-h/2);ctx.lineTo(x+bottom/2,y+h/2);ctx.lineTo(x-bottom/2,y+h/2);
  }else{
   const w=Math.min(top,bottom);
   ctx.rect(x-w/2,y-h/2,w,h);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=Math.max(1,s*.03);
  ctx.beginPath();ctx.moveTo(x-top/2,y-h/2+1);ctx.lineTo(x+top/2,y-h/2+1);ctx.moveTo(x-bottom/2,y+h/2-1);ctx.lineTo(x+bottom/2,y+h/2-1);ctx.stroke();
  ctx.restore();
 }
}

function fitRocket(){
 if(!parts.length||!W||!H)return;
 const xs=parts.map(p=>[p.x-p.u.w/2,p.x+p.u.w/2]).flat(),ys=parts.map(p=>[p.y-p.u.h/2,p.y+p.u.h/2]).flat();
 const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const hudH=$('#hud').getBoundingClientRect().height,top=Math.min(H-80,hudH+18),usableH=Math.max(80,H-top);
 cam.s=Math.max(4,Math.min(30,(W-32)/(maxX-minX+2),(usableH-32)/(maxY-minY+2)));
 cam.x=(minX+maxX)/2;
 cam.y=(minY+maxY)/2-(top+usableH/2-H/2)/cam.s;
}
function zoom(f,sx=W/2,sy=H/2){const[wx,wy]=toW(sx,sy);cam.s=Math.min(70,Math.max(4,cam.s*f));cam.x=wx-(sx-W/2)/cam.s;cam.y=wy-(sy-H/2)/cam.s;render()}

// Parts palette with live previews
const pal=$('#pal');
[...new Set(U.map(u=>u.g))].forEach(g=>{
 pal.insertAdjacentHTML('beforeend',`<h3>${g}</h3>`);const d=document.createElement('div');d.className='grp';
 U.filter(u=>u.g==g).forEach(u=>{
  const b=document.createElement('button');b.className='tile';b.innerHTML='<canvas width="112" height="112"></canvas><span>'+u.n+'</span>';
  draw(b.firstChild.getContext('2d'),u,56,56,Math.min(96/u.w,96/u.h),0);
  b.onpointerdown=e=>{e.preventDefault();const[x,y]=pt(e),[wx,wy]=toW(x,y),p=mk(u,wx,wy);sel=p;drag={p,ox:0,oy:0,x0:e.clientX,y0:e.clientY,pal:1};render()};
  d.append(b)});
 pal.append(d)});

cv.addEventListener('pointerdown',e=>{
 const[x,y]=pt(e),[wx,wy]=toW(x,y),h=[...parts].reverse().find(q=>Math.abs(wx-q.x)<=q.u.w/2&&Math.abs(wy-q.y)<=q.u.h/2||q.u.k=='solar'&&q.deployed&&Math.abs(wy-q.y)<=q.u.w*.4&&(q.x<0?wx>=q.x-q.u.w*2.25:wx<=q.x+q.u.w*2.25));
 if(h){sel=h;if(stageMode){toggleStagePick(h);render();return}drag={p:h,ox:h.x-wx,oy:h.y-wy,x0:e.clientX,y0:e.clientY}}else{sel=null;pan={x,y,cx:cam.x,cy:cam.y}}
 render()});
addEventListener('pointermove',e=>{
 const[x,y]=pt(e);
 if(drag){const[wx,wy]=toW(x,y),p=drag.p;p.x=wx+drag.ox;p.y=wy+drag.oy;snap(p)}
 else if(pan){cam.x=pan.cx-(x-pan.x)/cam.s;cam.y=pan.cy-(y-pan.y)/cam.s}
 else return;
 render()});
addEventListener('pointerup',e=>{
 if(drag&&document.elementFromPoint(e.clientX,e.clientY)?.closest('#pal')){
  const p=drag.p;if(drag.pal&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6){auto(p);sync(p)}else del(p)}
 drag=pan=null;render()});
addEventListener('pointercancel',()=>{if(drag&&drag.pal)del(drag.p);drag=pan=null;render()});
cv.addEventListener('wheel',e=>{e.preventDefault();const[x,y]=pt(e);zoom(Math.exp(-e.deltaY*.0015),x,y)},{passive:false});
addEventListener('keydown',e=>{if((e.key=='Delete'||e.key=='Backspace')&&sel){del(sel);render()}});

$('#ss').onclick=e=>{stageMode=!stageMode;e.currentTarget.setAttribute('aria-pressed',stageMode);render()};
$('#cs').onclick=createStage;$('#us').onclick=unstagePicked;
$('#mi').onclick=e=>{mirror=!mirror;e.currentTarget.setAttribute('aria-pressed',mirror);if(!mirror)parts.forEach(p=>p.tw=null);render()};
$('#de').onclick=()=>{if(sel){del(sel);render()}};
$('#cl').onclick=()=>{parts=[];sel=null;stagePick.clear();render()};
$('#zi').onclick=()=>zoom(1.25);$('#zo').onclick=()=>zoom(.8);
$('#sp').onclick=()=>{if(sel?.u.id=='solar'){sel.deployed=!sel.deployed;render()}};
const KEY='rocket-builder-blueprint';
function saveBlueprint(){try{localStorage.setItem(KEY,JSON.stringify(parts.map(p=>[p.u.id,p.x,p.y,parts.indexOf(p.tw),p.deployed,p.stage||0])));return true}catch{flash('Saving is blocked in this browser');return false}}
$('#sv').onclick=()=>{if(saveBlueprint())flash('Saved')};
$('#launch').onclick=()=>{if(saveBlueprint())location.href='launch-pad.html'};
$('#ld').onclick=()=>{try{const a=JSON.parse(localStorage.getItem(KEY));if(!a)return flash('Nothing saved yet');
 parts=[];sel=null;stagePick.clear();a.forEach(([id,x,y,,deployed,stage])=>{const p=mk(U.find(u=>u.id==id),x,y,Number.isInteger(stage)?stage:0);p.deployed=!!deployed});a.forEach((r,i)=>{if(r[3]>=0)parts[i].tw=parts[r[3]]});fitRocket();flash('Loaded');render()}catch{parts=[];flash('Could not read that save');render()}};

// Starter rocket
const add=(id,x,y)=>sync(mk(U.find(u=>u.id==id),x,y));
add('pod',0,-5);add('t2',0,-2.1);add('t2',0,1.9);add('e1',0,4.9);add('fin',1.7,2.9);

new ResizeObserver(()=>{const r=cv.getBoundingClientRect();W=r.width;H=r.height;D=devicePixelRatio||1;cv.width=W*D;cv.height=H*D;
 if(!init){init=1;render();fitRocket()}render()}).observe(cv);
new MutationObserver(render).observe(document.documentElement,{attributes:true});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
</script>
</body>
</html>
