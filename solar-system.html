<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar System · MRAFT</title>
<style>
:root{color-scheme:dark;--line:rgba(155,190,215,.2);--panel:rgba(8,18,30,.84);--text:#e7f2fb;--muted:#8da7ba;--accent:#55d7f2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(16px);box-shadow:0 16px 48px rgba(0,0,0,.35)}
#brand{top:14px;left:14px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#9af1ff,var(--accent));color:#061823;font-weight:900;font-size:17px}
.title{font-weight:800;letter-spacing:.12em;font-size:11px}.sub{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
#stats{left:14px;top:74px;padding:11px 13px;min-width:255px;font:10px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d5e6f1;border-left:2px solid var(--accent)}
#controls{right:14px;top:14px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:min(460px,calc(100% - 28px));justify-content:flex-end}
button,a.btn{min-height:34px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(180deg,#18364a,#112a3a);color:var(--text);font:650 12px system-ui,sans-serif;text-decoration:none;cursor:pointer}
button:hover,a.btn:hover{border-color:var(--accent);background:#20465c}button[aria-pressed=true]{background:var(--accent);color:#061823;border-color:var(--accent)}
#legend{left:14px;bottom:14px;padding:8px 11px;color:#9db4c4;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}
#toast{left:50%;bottom:68px;transform:translateX(-50%);padding:9px 13px;color:#ffd39e;display:none}
#hint{right:14px;bottom:14px;color:#8ca7b8;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right}
@media(max-width:700px){#brand{top:8px;left:8px}.sub{display:none}#stats{left:8px;top:58px;min-width:0;font-size:9px}#controls{right:8px;top:8px;max-width:58%}#hint{display:none}}
</style>
</head>
<body>
<canvas id="space"></canvas>

<div id="brand" class="panel">
  <div class="mark">✦</div>
  <div><div class="title">SOLAR SYSTEM</div><div class="sub">MRAFT orbital explorer</div></div>
</div>

<pre id="stats" class="panel"></pre>

<div id="controls" class="panel">
  <a class="btn" href="launch-pad.html">← Launch</a>
  <button id="target">Target</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset view</button>
  <button id="plus" title="Zoom in">+</button>
  <button id="minus" title="Zoom out">−</button>
</div>

<div id="legend" class="panel">Click a body to target · T next target · P pause · R reset</div>
<div id="hint">LIVE ORBITS · 1 AU SCALE</div>
<div id="toast" class="panel"></div>

<script>
const TAU=Math.PI*2;
const c=document.getElementById('space'),ctx=c.getContext('2d'),stats=document.getElementById('stats'),toast=document.getElementById('toast');
const roots=[
 {n:'Mercury',a:.39,T:.241,r:3.2,c:'#aaa39c'},
 {n:'Venus',a:.72,T:.615,r:4.6,c:'#d8af67'},
 {n:'Earth',a:1,T:1,r:5.2,c:'#468bd0',moons:[['Moon',.06,.0748,1.8,'#b8b8b2']]},
 {n:'Mars',a:1.52,T:1.881,r:4.1,c:'#b95f48',moons:[['Phobos',.015,.0037,1.1,'#8a7c70'],['Deimos',.04,.0096,1,'#a19383']]},
 {n:'Jupiter',a:5.2,T:11.86,r:10,c:'#c38f69',moons:[['Io',.14,.0049,1.7,'#dfc966'],['Europa',.20,.0098,1.5,'#d8d1ad'],['Ganymede',.28,.0196,2,'#9a9384'],['Callisto',.34,.0457,2,'#6d6358']]},
 {n:'Saturn',a:9.54,T:29.45,r:8.7,c:'#d2b77a',rings:true,moons:[['Titan',.35,.016,2.3,'#c78b4c']]},
 {n:'Uranus',a:19.2,T:84,r:7,c:'#78c6cf',rings:true},
 {n:'Neptune',a:30.1,T:164.8,r:7,c:'#4a78d0',moons:[['Triton',.22,.016,2,'#b8c7d5']]},
 {n:'Pluto',a:39.5,T:248,r:3.2,c:'#c2b19d'}
];
let targetIndex=2,paused=false,zoom=1,panX=0,panY=0,last=performance.now(),days=0,drag=null;

function resize(){const d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

function say(t){toast.textContent=t;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>toast.style.display='none',1800)}

function targetNext(){targetIndex=(targetIndex+1)%roots.length;say('Target: '+roots[targetIndex].n)}
function resetView(){zoom=1;panX=0;panY=0;days=0;say('View reset')}
document.getElementById('target').onclick=targetNext;
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';say(paused?'Simulation paused':'Simulation resumed')};
document.getElementById('reset').onclick=resetView;
document.getElementById('plus').onclick=()=>zoom=Math.min(4,zoom*1.22);
document.getElementById('minus').onclick=()=>zoom=Math.max(.55,zoom/1.22);

addEventListener('keydown',e=>{
 if(e.code==='KeyT'&&!e.repeat)targetNext();
 else if(e.code==='KeyP'&&!e.repeat){paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'}
 else if(e.code==='KeyR'&&!e.repeat)resetView();
 else if(e.code==='Escape')resetView();
 else if(e.code==='Equal'||e.code==='NumpadAdd')zoom=Math.min(4,zoom*1.15);
 else if(e.code==='Minus'||e.code==='NumpadSubtract')zoom=Math.max(.55,zoom/1.15);
});

c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(5,zoom*Math.exp(-e.deltaY*.001)))} ,{passive:false});
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY,id:e.pointerId};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag)return;panX=drag.px+(e.clientX-drag.x);panY=drag.py+(e.clientY-drag.y)});
c.addEventListener('pointerup',()=>drag=null);c.addEventListener('pointercancel',()=>drag=null);

function pos(body,i){
 const maxA=39.5,R=Math.min(innerWidth*.40,innerHeight*.39)*zoom;
 const rr=Math.max(28,Math.log1p(body.a)/Math.log1p(maxA)*R);
 const ang=i*.74+days/body.T*TAU;
 return [innerWidth*.5+panX+Math.cos(ang)*rr,innerHeight*.54+panY+Math.sin(ang)*rr*.62,rr,ang];
}

function bodyAt(x,y){
 let hit=-1,dist=30;
 roots.forEach((q,i)=>{const p=pos(q,i),d=Math.hypot(x-p[0],y-p[1]);if(d<dist){dist=d;hit=i}});
 return hit;
}

c.addEventListener('click',e=>{const i=bodyAt(e.clientX,e.clientY);if(i>=0){targetIndex=i;say('Target: '+roots[i].n)}});

function sphere(x,y,r,col,q){
 const g=ctx.createRadialGradient(x-r*.34,y-r*.4,1,x,y,r);
 g.addColorStop(0,'#fff');g.addColorStop(.13,col);g.addColorStop(1,'#03070c');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
 if(q.rings){ctx.strokeStyle='rgba(232,210,164,.72)';ctx.lineWidth=Math.max(1.5,r*.23);ctx.beginPath();ctx.ellipse(x,y,r*1.95,r*.62,-.25,0,TAU);ctx.stroke()}
}
function label(t,x,y,a=1){ctx.globalAlpha=a;ctx.fillStyle='#c9d7e0';ctx.font='10px system-ui,sans-serif';ctx.fillText(t,x,y);ctx.globalAlpha=1}

function drawStars(){
 ctx.fillStyle='rgba(255,255,255,.62)';
 for(let i=0;i<220;i++){const x=(i*97.17+23)%innerWidth,y=(i*53.91+11)%innerHeight,s=1+(i%4===0?1:.2);ctx.fillRect(x,y,s,s)}
}
function draw(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)days+=dt*12;
 ctx.fillStyle='#02050a';ctx.fillRect(0,0,innerWidth,innerHeight);drawStars();
 const cx=innerWidth*.5+panX,cy=innerHeight*.54+panY,R=Math.min(innerWidth*.40,innerHeight*.39)*zoom;
 roots.forEach(q=>{const rr=Math.max(28,Math.log1p(q.a)/Math.log1p(39.5)*R);ctx.strokeStyle='rgba(104,138,164,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*.62,0,0,TAU);ctx.stroke()});
 const sg=ctx.createRadialGradient(cx,cy,1,cx,cy,58);sg.addColorStop(0,'#fff6bd');sg.addColorStop(.18,'#ffca67');sg.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,58,0,TAU);ctx.fill();ctx.fillStyle='#ffe18c';ctx.beginPath();ctx.arc(cx,cy,12,0,TAU);ctx.fill();label('Sun',cx+18,cy+4);
 roots.forEach((q,i)=>{
   const p=pos(q,i),pr=Math.max(3.5,Math.min(11,q.r));sphere(p[0],p[1],pr,q.c,q);
   if(i===targetIndex){ctx.strokeStyle='#ffb15c';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(p[0],p[1],pr+9,0,TAU);ctx.stroke();ctx.setLineDash([])}
   label(q.n,p[0]+pr+6,p[1]+3,i===targetIndex?1:.82);
   if(q.moons)q.moons.forEach((m,j)=>{const mr=7+m[1]/.05*8,ang=days/m[2]*TAU+j;const x=p[0]+Math.cos(ang)*mr,y=p[1]+Math.sin(ang)*mr*.72;ctx.fillStyle=m[4];ctx.beginPath();ctx.arc(x,y,Math.max(2,m[3]),0,TAU);ctx.fill();label(m[0],x+5,y+3,.72)});
 });
 stats.textContent=[
  'SOLAR SYSTEM',
  'TARGET     '+roots[targetIndex].n,
  'TIME       '+days.toFixed(2)+' days',
  'PLANETS    9 major bodies',
  'MOONS      '+roots.reduce((n,q)=>n+(q.moons?q.moons.length:0),0)+' major tracked moons',
  'ZOOM       '+zoom.toFixed(2)+'×',
  'STATUS     '+(paused?'PAUSED':'RUNNING')
 ].join('\n');
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
