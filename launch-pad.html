<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Control · Rocket Flight</title>
<style>
:root{color-scheme:dark;--panel:rgba(10,22,35,.82);--panel-strong:rgba(11,25,39,.95);--line:rgba(155,190,215,.2);--text:#e7f2fb;--muted:#8da7ba;--accent:#55d7f2;--green:#77e0ad;--shadow:0 16px 48px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{overflow:hidden;background:#000;color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud,#msg,#ui,#brand{position:fixed;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:var(--shadow)}
#brand{top:14px;left:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;pointer-events:none}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:#061823;background:linear-gradient(145deg,#9af1ff,var(--accent));font-size:17px;font-weight:900;box-shadow:0 0 22px #55d7f255}
.brand-title{font-weight:750;letter-spacing:.12em;font-size:11px}.brand-sub{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
#hud{top:72px;left:14px;margin:0;padding:13px 15px;font:11px/1.85 ui-monospace,SFMono-Regular,Consolas,monospace;border-left:2px solid var(--accent);pointer-events:none;min-width:270px;max-width:min(360px,calc(100% - 28px));white-space:pre-wrap;color:#d8e9f5}
#msg{top:16px;right:14px;padding:9px 13px;font-weight:600;max-width:min(340px,calc(100% - 28px));color:var(--text)}
#msg:empty{display:none}
#ui{left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;padding:9px 10px;width:max-content;max-width:calc(100% - 20px);background:var(--panel-strong)}
.group{display:flex;align-items:center;gap:6px;padding:0 4px}.group+.group{border-left:1px solid var(--line);padding-left:10px}
button{min-height:36px;font:inherit;font-weight:650;color:var(--text);background:linear-gradient(180deg,#1a374d,#122b3d);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;touch-action:manipulation;transition:transform .15s,border-color .15s,background .15s}
button:hover{border-color:var(--accent);background:#20445b;transform:translateY(-1px)}button:active{transform:translateY(0)}button[aria-pressed=true]{color:#061823;background:var(--accent);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#thr-wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-width:190px;font-size:11px;color:var(--muted)}#thr-wrap output{min-width:34px;color:var(--accent);font:700 11px ui-monospace,monospace;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
#hint{position:fixed;z-index:1;right:16px;bottom:88px;color:#d5e7f4a8;font-size:11px;text-align:right;text-shadow:0 1px 4px #000;pointer-events:none}
#map-tools{position:fixed;z-index:3;top:14px;right:14px;display:none;align-items:center;gap:6px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(16px);box-shadow:var(--shadow)}
#map-tools.visible{display:flex}#map-tools button{min-width:38px;padding:6px 10px}#map-scale{min-width:54px;text-align:center;color:var(--muted);font:10px ui-monospace,monospace}
body.map-active canvas{cursor:grab}body.map-active canvas.dragging{cursor:grabbing}
@media(max-width:700px){#map-tools{top:auto;right:10px;bottom:75px;padding:5px;gap:4px}#map-tools button{min-height:32px;min-width:34px;padding:5px 8px}#map-scale{min-width:45px}}
@media(max-width:700px){#brand{top:10px;left:10px;padding:8px 10px}.brand-mark{width:28px;height:28px}#hud{top:58px;left:10px;min-width:0;font-size:10px;line-height:1.7;padding:9px 11px}#msg{top:10px;right:10px;font-size:11px}#ui{bottom:8px;max-width:calc(100% - 12px);gap:5px;padding:7px}.group{gap:4px;padding:0 2px}.group+.group{padding-left:6px}button{min-height:34px;padding:6px 9px;font-size:12px}#thr-wrap{min-width:145px;gap:5px}#hint{display:none}}
@media(max-width:430px){#brand{top:8px;left:8px}.brand-sub{display:none}#hud{top:50px;left:8px}#msg{top:8px;right:8px;max-width:48%}#ui{width:calc(100% - 12px)}.group{flex:1;justify-content:center}.group:first-child{flex-basis:100%;border-bottom:1px solid var(--line);padding-bottom:6px}.group+.group{border-left:0}#thr-wrap{width:100%}}
</style>
</head>
<body>
<canvas id="c" aria-label="Rocket flight simulation"></canvas>
<div id="brand"><span class="brand-mark">✦</span><span><span class="brand-title">LAUNCH CONTROL</span><br><span class="brand-sub">Flight simulation · <span id="flight-state">READY</span></span></span></div>
<pre id="hud" aria-live="polite"></pre>
<div id="msg" role="status"></div>
<div id="hint">A / D rotate · W / S throttle · Space stage · O pause · M map · drag to pan · scroll to zoom</div>
<div id="map-tools" aria-label="Map controls"><button id="map-fit" title="Fit orbit and body">Fit</button><button id="map-minus" aria-label="Zoom out">−</button><output id="map-scale">1×</output><button id="map-plus" aria-label="Zoom in">+</button><button id="map-center" aria-pressed="false" title="Follow rocket on the map">Follow</button></div>
<div id="ui" aria-label="Flight controls">
<div class="group"><button id="bl" aria-label="Rotate left" title="Rotate left (A)">&#9664;</button><button id="br" aria-label="Rotate right" title="Rotate right (D)">&#9654;</button>
<label id="thr-wrap" for="thr"><span>THROTTLE</span><input id="thr" type="range" min="0" max="100" value="0" aria-label="Throttle"><output id="thr-value">0%</output></label></div>
<div class="group"><button id="st" title="Separate stages (Space)">Stage</button><button id="pc" title="Deploy or cut parachute (P)">Chute</button><button id="mp" aria-pressed="false" title="Toggle orbital map (M)">Map</button></div>
<div class="group"><button id="wm" aria-label="Decrease time warp" title="Decrease time warp (,)">Warp &minus;</button><button id="wp" aria-label="Increase time warp" title="Increase time warp (.)">Warp +</button></div>
<div class="group"><button id="pause" aria-pressed="false" title="Pause simulation">Pause</button><button id="fs" title="Toggle fullscreen">Fullscreen</button><button id="rs" title="Restart flight (R)">Restart</button></div>
</div>
<script src="rocket-renderer.js"></script>
<script>
const g0=9.81,TAU=Math.PI*2,KEY='rocket-builder-blueprint',$=q=>document.querySelector(q),cv=$('#c'),cx=cv.getContext('2d'),hudEl=$('#hud'),msgEl=$('#msg'),thrEl=$('#thr');
// Part catalog (same ids as the builder): [w,h,dry t,fuel t,thrust kN,isp s,kind]
const U={
pod:[2,1.8,1.2,0,0,0,'pod'],
nose:[2,2,.2,0,0,0,'nose'],
t1:[2,2,.2,1.8,0,0,'tank'],
t2:[2,4,.4,3.6,0,0,'tank'],
t3:[3,4,.8,8.1,0,0,'tank'],
t4:[3,6,1.2,12.6,0,0,'tank'],
e1:[2,2,.9,0,220,290,'eng'],
e2:[2,1.8,.7,0,90,380,'vac'],
e3:[3,2.6,1.4,0,480,310,'eng'],
b1:[1.2,5,.5,6,300,240,'srb'],
b2:[1.6,7,.8,10,420,250,'srb'],
dc:[2,.4,.1,0,0,0,'dec'],
para:[2,1.6,.3,0,0,0,'para'],
dock:[1.2,.8,.2,0,0,0,'dock'],
solar:[2,3,.25,0,0,0,'solar'],
fin:[1.4,2,.1,0,0,0,'fin'],
leg:[1.6,2.6,.15,0,0,0,'leg']
};
const COL=MRAFT_ROCKET_RENDERER.COL;
const SAMPLE=[['pod',0,0],['t2',0,2.9],['e2',0,5.8],['dc',0,6.9],['t3',0,9.1],['e1',0,12.1],['b1',-2.1,8.6],['b1',2.1,8.6],['leg',-1.8,11.8],['leg',1.8,11.8]];
// Bodies: R m, mu m3/s2, a orbit radius m, atm [sea-level kg/m3, scale height m, top m]
const B=[{nm:'Sun',par:-1,R:2e7,mu:1e16,col:'#ffd27a'},
{nm:'Venus',par:0,R:5.7e5,mu:2.8e12,a:1.8e9,col:'#d9a85f',atm:[65,1.6e4,1.2e5],sky:[223,166,104]},
{nm:'Earth',par:0,R:6e5,mu:3.528e12,a:2.5e9,col:'#3f7d4e',atm:[1.2,7e3,5e4],sky:[111,180,255]},
{nm:'Moon',par:2,R:1.5e5,mu:3.6e10,a:3e7,col:'#9b9b97'},
{nm:'Mars',par:0,R:3e5,mu:3.33e11,a:4e9,col:'#b8603b',atm:[.02,1.1e4,6e4],sky:[201,141,98]},
{nm:'Jupiter',par:0,R:1.2e6,mu:1e14,a:8e9,col:'#c58c68',atm:[.9,2.7e4,1.8e5],sky:[205,155,122]},
{nm:'Europa',par:5,R:1.2e5,mu:3.2e10,a:2e7,col:'#c9c5a9'},
{nm:'Saturn',par:0,R:1.05e6,mu:5e13,a:1.2e10,col:'#d6bb78',atm:[.7,3.5e4,2e5],sky:[211,188,128]},
{nm:'Titan',par:7,R:1.4e5,mu:9e10,a:2.5e7,col:'#c68b4c',atm:[1.4,2.2e4,1.2e5],sky:[194,137,75]},
{nm:'Mercury',par:0,R:2.4e5,mu:2.2e11,a:1.2e9,col:'#9b8e82'},
{nm:'Uranus',par:0,R:8.5e5,mu:5.8e12,a:1.45e10,col:'#79c6cf',atm:[.4,3e4,1.8e5],sky:[105,194,211]},
{nm:'Neptune',par:0,R:8.2e5,mu:6.8e12,a:1.7e10,col:'#477ad4',atm:[.5,2.8e4,1.7e5],sky:[75,116,210]}];
const RINGED=new Set(['Saturn','Uranus']);
function drawMapRings(body,x,y,scale){if(!RINGED.has(body.nm))return;const r=body.R*scale;cx.save();cx.translate(x,y);cx.rotate(-.28);cx.strokeStyle='rgba(224,201,151,.78)';cx.lineWidth=Math.max(2,r*.18);cx.beginPath();cx.ellipse(0,0,Math.max(r*2.1,4),Math.max(r*.72,2),0,0,TAU);cx.stroke();cx.strokeStyle='rgba(111,91,61,.8)';cx.lineWidth=Math.max(1,r*.07);cx.beginPath();cx.ellipse(0,0,Math.max(r*1.55,3),Math.max(r*.53,1),0,0,TAU);cx.stroke();cx.restore()}
for(let i=1;i<B.length;i++){const b=B[i],p=B[b.par];b.om=Math.sqrt(p.mu/b.a**3);b.th0=i*1.7;b.soi=b.a*Math.pow(b.mu/p.mu,.4)}
const bp=(i,t)=>{const b=B[i],th=b.th0+b.om*t,c=Math.cos(th),s=Math.sin(th);return[b.a*c,b.a*s,-b.a*b.om*s,b.a*b.om*c]};
const WARP=[1,2,5,10,50,100,1e3,1e4,1e5],ST=Array.from({length:150},()=>[Math.random(),Math.random(),Math.random()*1.4+.4]);
let S,V,PR,userStages=[],userStageIndex=0,UT=0,Q=[],K={},hold={L:0,R:0},mapOn=0,paused=0,zf=7,zm=1e-3,mapX=0,mapY=0,mapDrag=null,mapFollow=0,mapFitScale=1e-3,PRESS=1,dpr=1,last=performance.now(),hT=0,mt,ART=null,ART_BOX=null,ART_UP=-1,ART_COUNT=0,launchElapsed=0,launchReleased=false,launchHoldNotified=false;
const VISITED_KEY='rocket-flight-visited-bodies',VISITABLE=B.map((b,i)=>i).filter(i=>i!==0);let visited=new Set([2]);
try{const saved=JSON.parse(localStorage.getItem(VISITED_KEY));if(Array.isArray(saved))saved.forEach(i=>{if(VISITABLE.includes(i))visited.add(i)})}catch(e){}
const markVisited=i=>{if(VISITABLE.includes(i)&&!visited.has(i)){visited.add(i);try{localStorage.setItem(VISITED_KEY,JSON.stringify([...visited]))}catch(e){}}};
const FS=p=>p.k=='vac'?.4:p.k=='srb'?.93:.91,IV=p=>p.k=='vac'?p.I:p.I/FS(p),wr=a=>Math.atan2(Math.sin(a),Math.cos(a));
function msg(t,ms){msgEl.textContent=t;clearTimeout(mt);mt=setTimeout(()=>msgEl.textContent='',ms||3500)}

// Blueprint -> vehicle. Keep the builder's rendered artwork for the intact launch vehicle.
function loadV(){let a=null,note='';try{a=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!Array.isArray(a)||!a.length||!a.every(r=>Array.isArray(r)&&U[r[0]]&&isFinite(r[1])&&isFinite(r[2]))){a=SAMPLE;note='No saved rocket found here, so this is the sample rocket.'}
 const P=a.map(r=>{const d=U[r[0]];return{id:r[0],x:+r[1],y:+r[2],w:d[0],h:d[1],m:d[2],f:d[3],F:d[4],I:d[5],k:d[6],deployed:!!r[4],stage:Number.isInteger(r[5])?r[5]:0}});
 userStages=[...new Set(P.map(p=>p.stage).filter(n=>n>0))].sort((a,b)=>a-b);userStageIndex=0;
 const av=k=>{const l=P.filter(p=>k.includes(p.k));return l.length?l.reduce((s,p)=>s+p.y,0)/l.length:null},e=av(['eng','vac']),t=av(['pod','nose']),up=e!=null&&t!=null&&e<t?1:-1;
 P.forEach(p=>p.u=up*p.y);V=P;ART=null;ART_BOX=null;ART_UP=up;ART_COUNT=P.length;
 if(!note){try{const box=JSON.parse(localStorage.getItem('rocket-builder-art-meta')),src=localStorage.getItem('rocket-builder-art');if(box&&src&&[box.minX,box.minY,box.maxX,box.maxY,box.scale].every(Number.isFinite)){const im=new Image();ART_BOX=box;im.onload=()=>{ART=im};im.src=src}}catch(e){}}
 return note}
function props(){const Dc=V.filter(p=>p.k=='dec').map(p=>p.u);V.forEach(p=>{p.s=Dc.filter(d=>d<p.u-1e-6).length});
 let m=0,cu=0,mn=1e9,mx=-1e9,W=0;
 for(const p of V){const w=p.m+p.f;m+=w;cu+=w*p.u;mn=Math.min(mn,p.u-p.h/2);mx=Math.max(mx,p.u+p.h/2);W=Math.max(W,2*(Math.abs(p.x)+p.w/2))}
 const c=m?cu/m:0;PR={m,c,db:c-mn,top:mx-c,hw:W/2,W,L:mx-mn,legs:V.some(p=>p.k=='leg'),para:V.some(p=>p.k=='para')}}
// Only the bottom stage (below the lowest decoupler) burns; tanks in that stage feed its engines, boosters use their own fuel.
const act=()=>{
 if(userStages.length){const current=userStages[userStageIndex],active=p=>p.stage===0||p.stage===current||p.k=='srb';
  const tanks=V.some(q=>active(q)&&q.k=='tank'&&q.f>0);
  return V.filter(p=>active(p)&&p.F&&(p.k=='srb'?p.f>0:tanks))}
 return V.filter(p=>p.s==0&&p.F&&(p.k=='srb'?p.f>0:V.some(q=>q.s==0&&q.k=='tank'&&q.f>0)))};
function take(a){let t=0;for(const q of V)if((userStages.length?(q.stage===0||q.stage===userStages[userStageIndex]):q.s==0)&&q.k=='tank'&&q.f>0&&t<a){const d=Math.min(q.f,a-t);q.f-=d;t+=d}return t}
function burn(E,h,P){let F=0;for(const p of E){let u=p.F/(p.I*g0)*(p.k=='srb'?1:S.thr)*h;if(p.k=='srb'){u=Math.min(p.f,u);p.f-=u}else u=take(u);F+=u/h*IV(p)*(1-(1-FS(p))*P)*g0}return F}
function dv(){let t=0;const n=Math.max(0,...V.map(p=>p.s));for(let j=0;j<=n;j++){let F=0,Fi=0,f=0,m0=0;const tk=V.some(q=>q.s==j&&q.k=='tank'&&q.f>0);
 for(const p of V){if(p.s>=j)m0+=p.m+p.f;if(p.s==j){f+=p.f;if(p.F&&(p.k=='srb'?p.f>0:tk)){F+=p.F;Fi+=p.F/IV(p)}}}
 if(F&&f>0&&m0>f)t+=F/Fi*g0*Math.log(m0/(m0-f))}return t}
function elem(){const b=B[S.cb],r=Math.hypot(S.x,S.y),v2=S.vx*S.vx+S.vy*S.vy,h=S.x*S.vy-S.y*S.vx,rv=S.x*S.vx+S.y*S.vy,k=v2-b.mu/r,ex=(k*S.x-rv*S.vx)/b.mu,ey=(k*S.y-rv*S.vy)/b.mu,e=Math.hypot(ex,ey),p=h*h/b.mu;
 return{e,p,w:Math.atan2(ey,ex),dir:h<0?-1:1,pe:p/(1+e),ap:e<1?p/(1-e):Infinity}}

function reset(){const note=loadV();props();launchElapsed=0;launchReleased=false;launchHoldNotified=false;S={cb:2,x:0,y:B[2].R+PR.db+1.5,vx:0,vy:0,psi:Math.PI/2,w:0,wi:0,thr:0,land:1,lw:1,dead:0,chute:0,orb:0};markVisited(S.cb);UT=0;Q=[];paused=0;mapOn=0;mapDrag=null;mapFollow=0;cv.classList.remove('dragging');thrEl.value=0;$('#thr-value').textContent='0%';thrEl.disabled=true;$('#pause').textContent='Pause';$('#pause').setAttribute('aria-pressed','false');$('#mp').setAttribute('aria-pressed','false');updateMapTools();
 msg((note?note+' ':'')+'Launch sequence: vehicle suspended from the service tower.',6000)}
function crash(){S.dead=1;S.thr=0;for(let i=0;i<150;i++){const a=Math.random()*TAU,s=Math.random()*45;Q.push({x:S.x,y:S.y,vx:S.vx*.2+Math.cos(a)*s,vy:S.vy*.2+Math.sin(a)*s,l:0,m:1+Math.random()*2.5,r:1+Math.random()*3,g:2,a:.8,dr:.6,c:i%3?'255,150,50':'220,220,220'})}msg('Rocket destroyed. Press R to rebuild.',1e5)}
function stage(){if(S.dead)return;if(!launchReleased)return msg('Await tower release.');
 if(userStages.length){const current=userStages[userStageIndex];if(current==null)return msg('No staged group left.');
  const dropped=V.filter(p=>p.stage===current);V=V.filter(p=>p.stage!==current);userStageIndex++;
  const ux=Math.cos(S.psi),uy=Math.sin(S.psi);for(const p of dropped){const lu=p.u-PR.c;Q.push({x:S.x+uy*p.x+ux*lu,y:S.y-ux*p.x+uy*lu,vx:S.vx-ux*4+(Math.random()-.5)*8,vy:S.vy-uy*4+(Math.random()-.5)*8,l:0,m:1.2,r:.7,g:2,a:.45,dr:.3,c:'220,230,238'})}
  S.vx+=ux*.6;S.vy+=uy*.6;props();msg('Stage '+current+' separated.',2500);return}
 const D=V.filter(p=>p.k=='dec');if(!D.length)return msg('No decoupler to separate.');
 const lo=Math.min(...D.map(p=>p.u)),ux=Math.cos(S.psi),uy=Math.sin(S.psi);V=V.filter(p=>p.u>lo+1e-6);
 for(let i=0;i<40;i++)Q.push({x:S.x-ux*PR.db,y:S.y-uy*PR.db,vx:S.vx+(Math.random()-.5)*14-ux*8,vy:S.vy+(Math.random()-.5)*14-uy*8,l:0,m:1.5,r:.6,g:2,a:.5,dr:.2,c:'230,230,230'});
 S.vx+=ux*.6;S.vy+=uy*.6;props();msg('Stage separated.',2500)}
function chute(){if(!PR.para)return msg('No parachute fitted.');S.chute=!S.chute;msg(S.chute?'Parachute deployed.':'Parachute cut.')}
function setThr(v){S.thr=v;thrEl.value=v*100;$('#thr-value').textContent=Math.round(v*100)+'%'}
function launchThrust(){return act().reduce((sum,p)=>sum+p.F*(1-(1-FS(p))*PRESS)*(p.k=='srb'?1:S.thr),0)}
function warp(d){S.wi=Math.max(0,Math.min(WARP.length-1,S.wi+d))}
function togglePause(){paused=!paused;const b=$('#pause');b.textContent=paused?'Resume':'Pause';b.setAttribute('aria-pressed',paused);last=performance.now()}
let solarZoom=1,solarPanX=0,solarPanY=0,solarFollow=0;
const SOLAR_DISPLAY_PLUTO={nm:'Pluto',a:2.2e10,R:1.2e5,col:'#c8b49a'};
function solarRootIndices(){return B.map((q,i)=>q.par===0&&i>0?i:null).filter(i=>i!==null).filter(i=>B[i].nm!=='Sun')}
function solarMaxOrbit(){return Math.max(2.2e10,...solarRootIndices().map(i=>B[i].a||0))}
function solarAbs(i){
 let x=0,y=0;
 for(let k=i;k>0;k=B[k].par){const q=bp(k,UT);x+=q[0];y+=q[1]}
 return[x,y];
}
function solarScreen(x,y){
 const W=innerWidth,H=innerHeight,K=4e8,max=solarMaxOrbit(),R=.43*Math.min(W,H)*solarZoom;
 const d=Math.hypot(x,y);
 if(d<1)return[W/2+solarPanX,H/2+solarPanY];
 const rr=R*Math.log1p(d/K)/Math.log1p(max/K),a=Math.atan2(y,x);
 return[W/2+solarPanX+Math.cos(a)*rr,H/2+solarPanY-Math.sin(a)*rr];
}
function solarRadius(a){
 const K=4e8,max=solarMaxOrbit(),R=.43*Math.min(innerWidth,innerHeight)*solarZoom;
 return R*Math.log1p(a/K)/Math.log1p(max/K);
}
function solarRocketScreen(){

     cx.fillStyle=m[4]||'#aaa';cx.beginPath();cx.arc(x,y,1.7,0,TAU);cx.fill();
   });
 }

 // Rocket marker
 const rp=solarRocketScreen();
 cx.save();cx.translate(rp[0],rp[1]);cx.rotate(-S.psi);
 cx.fillStyle='#f3f7fb';cx.strokeStyle='#55d7f2';cx.lineWidth=1.2;
 cx.beginPath();cx.moveTo(0,-9);cx.lineTo(4.5,5);cx.lineTo(0,3);cx.lineTo(-4.5,5);cx.closePath();cx.fill();cx.stroke();
 cx.fillStyle='#ff8746';cx.beginPath();cx.moveTo(-2.4,4);cx.lineTo(0,12);cx.lineTo(2.4,4);cx.closePath();cx.fill();
 cx.restore();
 cx.fillStyle='#7fe2ad';cx.font='700 10px system-ui,sans-serif';cx.fillText('Rocket',rp[0]+9,rp[1]+4);

 // Header and legend
 cx.fillStyle='#e8f3fa';cx.font='800 13px system-ui,sans-serif';cx.fillText('SOLAR SYSTEM',18,28);
 cx.fillStyle='#8da7ba';cx.font='10px ui-monospace,monospace';cx.fillText('SUN → MERCURY → VENUS → EARTH → MARS → JUPITER → SATURN → URANUS → NEPTUNE → PLUTO',18,46);

 // Planet index panel
 const panelW=210,panelH=roots.length*22+38,px=18,py=H- panelH-48;
 cx.fillStyle='rgba(4,10,17,.80)';cx.strokeStyle='rgba(155,190,215,.18)';
 cx.beginPath();cx.roundRect(px,py,panelW,panelH,11);cx.fill();cx.stroke();
 cx.fillStyle='#dceaf3';cx.font='700 10px system-ui,sans-serif';cx.fillText('PLANETS',px+10,py+17);
 roots.forEach((i,n)=>{
   const q=B[i],y=py+35+n*22;cx.fillStyle=q.col;cx.beginPath();cx.arc(px+14,y-3,3.2,0,TAU);cx.fill();
   cx.fillStyle=i===S.cb?'#7ee7ff':'#b8cad5';cx.font='9px system-ui,sans-serif';cx.fillText(q.nm,px+25,y);
 });
 cx.fillStyle=SOLAR_DISPLAY_PLUTO.col;cx.beginPath();cx.arc(px+14,py+35+roots.length*22-3,3.2,0,TAU);cx.fill();
 cx.fillStyle='#b8cad5';cx.fillText('Pluto',px+25,py+35+roots.length*22);
 cx.fillStyle='#8099aa';cx.font='10px ui-monospace,monospace';cx.fillText('Drag pan · wheel zoom · Fit all · Follow rocket',18,H-18);
}
function hud(){const b=B[S.cb],r=Math.hypot(S.x,S.y),sp=Math.hypot(S.vx,S.vy),vr=(S.x*S.vx+S.y*S.vy)/r,el=elem(),km=m=>Math.abs(m)>=1e4?(m/1e3).toFixed(Math.abs(m)>=1e7?0:1)+' km':Math.round(m)+' m',
  F=act().reduce((s,p)=>s+p.F,0),fs=V.reduce((s,p)=>s+(p.s==0?p.f:0),0),stable=el.e<1&&el.pe>b.R+(b.atm?b.atm[2]:0);
 if(stable&&!S.orb)msg('Stable orbit around '+b.nm+'.',5000);S.orb=stable;
 $('#flight-state').textContent=paused?'PAUSED':S.dead?'VEHICLE LOST':!launchReleased?(launchElapsed<2.2?'COUNTDOWN':launchElapsed>=5.4&&launchThrust()<=PR.m*g0*1.05?'HOLD':'IGNITION'):launchElapsed<7.2?'LIFTOFF':S.land?'ON PAD':stable?'IN ORBIT':'IN FLIGHT';
 hudEl.textContent=['FLIGHT DATA  /  '+b.nm.toUpperCase(),'ALTITUDE   '+km(r-b.R),'SPEED      '+Math.round(sp)+' m/s   |   VERT '+Math.round(vr)+' m/s','APOAPSIS   '+(el.e<1?km(el.ap-b.R):'ESCAPE')+'   |   PE '+km(el.pe-b.R),
  'THROTTLE   '+Math.round(S.thr*100)+'%   |   TWR '+(F?(F/(PR.m*b.mu/(r*r))).toFixed(2):'0.00'),'STAGING    '+(userStages.length?(userStageIndex<userStages.length?`${userStageIndex+1}/${userStages.length}`:'CORE'):'AUTO'),'STAGE FUEL '+fs.toFixed(1)+' t   |   DELTA-V '+Math.round(dv())+' m/s','MASS       '+PR.m.toFixed(1)+' t   |   WARP x'+WARP[S.wi],'GAME COMPLETE '+Math.floor(visited.size/VISITABLE.length*100)+'%   ('+visited.size+'/'+VISITABLE.length+' worlds explored)'].join('\n')}

const SOLAR_STATE_KEY='mraft-solar-flight-state';
let solarStateStamp=0;
function saveSolarFlightState(now){
 if(now-solarStateStamp<350)return;
 solarStateStamp=now;
 try{
   let hx=S.x,hy=S.y,hvx=S.vx,hvy=S.vy,idx=S.cb;
   while(idx>0){const q=bp(idx,UT);hx+=q[0];hy+=q[1];hvx+=q[2];hvy+=q[3];idx=B[idx].par}
   localStorage.setItem(SOLAR_STATE_KEY,JSON.stringify({
     at:Date.now(),ut:UT,body:B[S.cb].nm,bodyIndex:S.cb,
     x:S.x,y:S.y,vx:S.vx,vy:S.vy,hx,hy,hvx,hvy,
     altitude:Math.hypot(S.x,S.y)-B[S.cb].R,
     speed:Math.hypot(S.vx,S.vy),launched:launchReleased,dead:!!S.dead
   }));
 }catch(_){}
}

function frame(now){const dt=Math.min(.05,(now-last)/1e3);last=now;const b=B[S.cb];PRESS=b.atm?Math.exp(-Math.max(Math.hypot(S.x,S.y)-b.R,0)/b.atm[1]):0;
 if(!paused){
  if(!launchReleased){launchElapsed+=dt;const previous=launchElapsed-dt;
   if(launchElapsed>=2.2&&previous<2.2)msg('Engine ignition — service tower shaking.',3500);
   setThr(Math.min(1,Math.max(0,(launchElapsed-2.2)/1.1)));
   if(launchElapsed>=5.4){
    if(launchThrust()>PR.m*g0*1.05){launchReleased=true;S.land=0;thrEl.disabled=false;msg('Tower released — liftoff!',4500)}
    else if(!launchHoldNotified){launchHoldNotified=true;msg('Launch hold: active engines need more thrust to lift this rocket.',6000)}
   }
  }else control(dt);
  if(launchReleased)sim(dt);particles(dt)
 saveSolarFlightState(now)
 }
 props();if(mapOn&&mapFollow){mapX=S.x;mapY=S.y}cx.setTransform(dpr,0,0,dpr,0,0);if(mapOn){window.__solarMapFrame?.();window.__solarAfterMap?.()}else flight(now/1e3);
 if(now-hT>120){hT=now;hud();window.__solarHud?.()}if(mapOn){window.__solarMapFrame?.();window.__solarAfterMap?.()}else flight(now/1e3);window.__solarFrame?.(now/1e3);requestAnimationFrame(frame)}
function resize(){dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
addEventListener('resize',resize);
addEventListener('keydown',e=>{K[e.code]=1;const c=e.code;if(!e.repeat){if(c=='Space')stage();else if(c=='KeyM')toggleMap();else if(c=='KeyP')chute();else if(c=='KeyZ')setThr(1);else if(c=='KeyX')setThr(0);else if(c=='Period')warp(1);else if(c=='Comma')warp(-1);else if(c=='KeyO')togglePause();else if(c=='KeyR')reset();else if(mapOn&&(c=='Equal'||c=='NumpadAdd'))mapZoom(1.25);else if(mapOn&&(c=='Minus'||c=='NumpadSubtract'))mapZoom(.8);else if(mapOn&&c=='KeyC')centerMap()}
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c)||(mapOn&&['Equal','Minus','NumpadAdd','NumpadSubtract'].includes(c)))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
cv.addEventListener('pointerdown',e=>{if(!mapOn)return;solarFollow=0;updateMapTools();mapDrag={id:e.pointerId,x:e.clientX,y:e.clientY,cx:solarPanX,cy:solarPanY};cv.setPointerCapture(e.pointerId);cv.classList.add('dragging');e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!mapDrag||e.pointerId!==mapDrag.id)return;solarPanX=mapDrag.cx+(e.clientX-mapDrag.x);solarPanY=mapDrag.cy+(e.clientY-mapDrag.y)});
const endMapDrag=e=>{if(mapDrag&&e.pointerId===mapDrag.id){mapDrag=null;cv.classList.remove('dragging')}};
cv.addEventListener('pointerup',endMapDrag);cv.addEventListener('pointercancel',endMapDrag);
cv.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*.001);if(mapOn)mapZoom(f);else zf=Math.min(60,Math.max(.3,zf*f))},{passive:false});
$('#st').onclick=stage;$('#pc').onclick=chute;$('#wm').onclick=()=>warp(-1);$('#wp').onclick=()=>warp(1);$('#rs').onclick=reset;$('#pause').onclick=togglePause;
$('#mp').onclick=toggleMap;$('#map-fit').onclick=fitMap;$('#map-minus').onclick=()=>mapZoom(.8);$('#map-plus').onclick=()=>mapZoom(1.25);$('#map-center').onclick=centerMap;thrEl.oninput=()=>setThr(thrEl.value/100);
$('#fs').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.();return}const p=document.documentElement.requestFullscreen?.();if(p)p.catch(()=>msg('Fullscreen is unavailable in this browser.'))};
document.addEventListener('fullscreenchange',()=>$('#fs').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen');
[['bl','L'],['br','R']].forEach(([id,k])=>{const e=$('#'+id);e.onpointerdown=()=>hold[k]=1;['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>hold[k]=0))});
resize();reset();requestAnimationFrame(frame);
